[package]
name = "pnm-viewer-qt"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace]

[dependencies]
cxx = "=1.0.158"
cxx-qt = "=0.7.3"
cxx-qt-lib = { version = "=0.7.3", features = ["qt_gui", "qt_qml"] }
viewer = { path = "../viewer" }
serde_json = "1"

[build-dependencies]
# Keep generated CXX symbols aligned with the pinned cxx runtime.
cxx-gen = "=0.7.158"
cxx-qt-build = "=0.7.3"

[dev-dependencies]
pnm-fixtures = { path = "../../tests/fixtures" }

[profile.release]
lto = true
codegen-units = 1
strip = true
