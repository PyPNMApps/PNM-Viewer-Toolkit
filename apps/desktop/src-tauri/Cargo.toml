[package]
name = "pnm-viewer-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
tauri = { version = "=2.9.5", features = [] }
tauri-plugin-dialog = "=2.4.2"
pnm = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pnm-fixtures = { path = "../../../tests/fixtures" }

[profile.release]
lto = true
codegen-units = 1
strip = true
