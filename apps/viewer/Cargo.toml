[package]
name = "viewer"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[dependencies]
pnm = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
pnm-fixtures = { path = "../../tests/fixtures" }
tempfile = "=3.23.0"
