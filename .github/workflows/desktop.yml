name: Desktop checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    name: Qt and Tauri / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake python3-venv libgl1-mesa-dev
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check retained Tauri desktop
        run: bash scripts/check-desktop.sh
      - name: Prepare pinned native Qt SDK
        run: python scripts/qt-sdk.py setup
      - name: Check Qt adapter and presentation
        run: python scripts/qt-sdk.py check
