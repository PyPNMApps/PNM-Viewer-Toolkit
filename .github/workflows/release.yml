name: Native releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    name: Validate release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match stable version and master ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 tools/release/versions.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
  validate:
    needs: tag
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      run_native_checks: true
      package_release: true
  ubuntu-install:
    name: DEB lifecycle / ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: native-ubuntu-22.04
          path: release
      - name: Verify unchanged baseline package bytes
        run: python3 scripts/release/verify.py --packages release
      - name: Install test display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Install, open, render, export and remove packages
        run: |
          set -o pipefail
          xvfb-run -a python3 scripts/release/test-installed.py --packages release --ci-disposable-host 2>&1 | tee lifecycle.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle.log
          if-no-files-found: warn
  publish:
    name: Publish verified native release
    needs: [validate, ubuntu-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts
      - name: Verify complete asset set
        run: python3 scripts/release/collect.py --source artifacts --output release-assets
      - name: Render release page with installation instructions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release/notes.py --assets release-assets \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output release-page.md
      - name: Verify uploaded bytes and publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/publish.py --assets release-assets --notes release-page.md \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" \
            --title "PNM Viewer Toolkit $RELEASE_TAG — Development build"
