name: Native packages (manual full matrix)
on:
  # Temporary: tag pushes use ubuntu-deb-temp.yml instead.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    name: Validate release identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match stable version and master ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 tools/release/versions.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
  validate:
    needs: tag
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      run_native_checks: true
  package:
    name: Package / ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enable MSVC compiler and app-local runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Pin Cargo to the MSVC linker
        if: runner.os == 'Windows'
        run: python scripts/qt-sdk.py export-msvc-linker
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-venv patchelf libgl1-mesa-dev libegl1 libopengl0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-render0 libsm6 libice6 libgtk-3-0 libb2-1
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-package
          key: ${{ matrix.os }}-qt-${{ hashFiles('scripts/qt-sdk.py') }}
          workspaces: |
            . -> target
            apps/qt -> target
          cache-bin: false
      - name: Cache pinned native Qt SDK
        uses: actions/cache@v4
        with:
          path: local/qt
          key: qt-sdk-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/qt-sdk.py') }}
      - name: Prepare pinned native Qt SDK
        run: python scripts/qt-sdk.py setup
      - name: Build native packages and enforce size budget
        run: python scripts/release/build.py --output dist/release
      - name: Verify package bytes
        run: python scripts/release/verify.py --packages dist/release
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
      - name: Retain partial build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: package-diagnostics-${{ matrix.os }}
          path: |
            dist/release/*.json
            dist/release-stage/installer.nsi
          if-no-files-found: ignore
  ubuntu-install:
    name: DEB lifecycle / ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: native-ubuntu-22.04
          path: release
      - name: Verify unchanged baseline package bytes
        run: python3 scripts/release/verify.py --packages release
      - name: Install test display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Install, open, render, export and remove packages
        run: |
          set -o pipefail
          xvfb-run -a python3 scripts/release/test-installed.py --packages release --ci-disposable-host 2>&1 | tee lifecycle.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle.log
          if-no-files-found: warn
  native-install:
    name: Native lifecycle / ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: release
      - name: Verify package bytes
        run: python scripts/release/verify.py --packages release
      - name: Install, open, render, export and remove packages
        run: |
          set -o pipefail
          python scripts/release/test-installed.py --packages release --ci-disposable-host 2>&1 | tee lifecycle.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle.log
          if-no-files-found: warn
  draft:
    name: Assemble verified draft release
    needs: [ubuntu-install, native-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: artifacts
      - name: Verify complete asset set
        run: python3 scripts/release/collect.py --source artifacts --output release-assets
      - name: Render release page with installation instructions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release/notes.py --assets release-assets \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output release-page.md
      - name: Attach verified assets to a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true || { echo 'Refusing to modify a public release'; exit 1; }
            gh release edit "$RELEASE_TAG" --notes-file release-page.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "PNM Viewer Toolkit $RELEASE_TAG — Development build" \
              --notes-file release-page.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
