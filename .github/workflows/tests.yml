name: Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Load pinned toolchain
        run: rustup show
      - name: Test workspace and CLI
        run: cargo test --workspace --locked
      - name: Test version and packaging tools
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      - name: Test Linux installer and push tooling
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tools/git/tests -p 'test_*.py'
          python -m unittest discover -s scripts/tests -p 'test_*.py'
