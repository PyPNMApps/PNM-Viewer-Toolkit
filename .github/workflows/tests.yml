name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load pinned toolchain
        run: rustup show
      - name: Test workspace and CLI
        run: cargo test --workspace --locked
      - name: Test release tools
        run: python -m unittest discover -s tools/release -p 'test_*.py'
      - name: Test push gate with fake Git
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools/git/tests -p 'test_*.py'
      - name: Test Ubuntu installer with fake host tools
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
