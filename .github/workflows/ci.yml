name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_checks:
        description: Run the preserved full native platform matrix
        type: boolean
        default: true
  workflow_call:
    inputs:
      package_release:
        description: Package and lifecycle-test native installers in the test jobs
        type: boolean
        default: false
      run_native_checks:
        description: Run the full native platform matrix
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: rust,python,actions
          build-mode: none
      - uses: github/codeql-action/analyze@v4
  quality:
    name: Code checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check sanitized fixtures
        run: |
          python3 tools/security/pnm-mac-updater.py
          python3 -m unittest discover -s tools/security -p 'test_*.py'
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_disk_guard.py'
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Check workspace and desktop formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/qt/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check scripts and versions
        run: |
          python3 tools/release/versions.py
          bash -n install.sh
          for script in scripts/*.sh tools/git/*.sh tools/bump-version.sh; do bash -n "$script"; done
          shellcheck install.sh scripts/*.sh tools/git/*.sh tools/bump-version.sh
  native-baseline:
    # Let DEB lifecycle checks follow the baseline, without waiting for Mac/Win.
    if: inputs.run_native_checks == true && inputs.package_release == true
    needs: [codeql, quality]
    uses: ./.github/workflows/native-checks.yml
    with:
      runners: '["ubuntu-22.04"]'
      package_release: true
  native:
    # Tags request the full native matrix; branch/PR checks remain lean.
    if: inputs.run_native_checks == true
    needs: [codeql, quality]
    uses: ./.github/workflows/native-checks.yml
    with:
      runners: ${{ inputs.package_release && '["ubuntu-24.04", "ubuntu-26.04", "windows-2022", "macos-15", "macos-15-intel"]' || '["ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "windows-2022", "macos-15", "macos-15-intel"]' }}
      package_release: ${{ inputs.package_release == true }}
  required:
    name: Required checks
    if: always()
    needs: [codeql, quality, native-baseline, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every stage to succeed
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BASELINE_RESULT: ${{ needs.native-baseline.result }}
          PACKAGE_RELEASE: ${{ inputs.package_release == true }}
          NATIVE_RESULT: ${{ needs.native.result }}
          RUN_NATIVE: ${{ inputs.run_native_checks == true }}
        run: |
          test "$CODEQL_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [[ "$RUN_NATIVE" == true && "$PACKAGE_RELEASE" == true ]]; then
            test "$BASELINE_RESULT" = success
          else
            test "$BASELINE_RESULT" = skipped
          fi
          if [[ "$RUN_NATIVE" == true ]]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi
