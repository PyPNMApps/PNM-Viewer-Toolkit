name: Code checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check shell scripts
        run: |
          for script in install.sh scripts/install-cli.sh scripts/check-before-push.sh tools/git/git-save.sh tools/git/git-push.sh; do
            bash -n "$script"
          done
          shellcheck install.sh scripts/install-cli.sh scripts/check-before-push.sh tools/git/git-save.sh tools/git/git-push.sh
