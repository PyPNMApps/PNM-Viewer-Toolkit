# Temporary Ubuntu-only development artifacts; never a full release gate.
name: Ubuntu 22.04 DEB (temporary)
on:
  # Historical troubleshooting path; automatic tags use release.yml.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu-deb-temp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    name: Validate development tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching version and master ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release/versions.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
  code-checks:
    needs: tag
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    with:
      run_native_checks: false
  deb:
    name: Build and test Ubuntu 22.04 DEBs
    needs: code-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CC: ccache cc
      CXX: ccache c++
      CCACHE_DIR: ${{ github.workspace }}/local/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build and lifecycle prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lld ccache build-essential cmake python3-venv shellcheck patchelf xvfb xauth libgl1-mesa-dev libegl1 libopengl0 libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-render0 libsm6 libice6 libgtk-3-0 libb2-1
      - name: Cache C and C++ compilation
        uses: actions/cache@v5
        with:
          path: local/ccache
          key: cpp-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/qt-sdk.py') }}-${{ github.sha }}
          restore-keys: |
            cpp-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/qt-sdk.py') }}-
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Reuse compatible native-check caches from master; tag-only caches
          # cannot be restored by later tags.
          shared-key: native
          key: ubuntu-22.04-qt-${{ hashFiles('scripts/qt-sdk.py') }}
          workspaces: |
            . -> target
            apps/qt -> target
          cache-bin: false
      - name: Find reusable outputs from a successful ancestor tag
        id: native-cache-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/native_cache.py select
      - name: Download previous native build outputs
        if: steps.native-cache-source.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.native-cache-source.outputs.artifact_name }}
          path: local/previous-native-cache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native-cache-source.outputs.run_id }}
      - name: Restore validated native build outputs
        if: steps.native-cache-source.outputs.run_id != ''
        run: python3 scripts/ci/native_cache.py restore --directory local/previous-native-cache
      - name: Initialize compiler cache statistics
        run: ccache --zero-stats
      - name: Cache pinned native Qt SDK
        uses: actions/cache@v5
        with:
          path: local/qt
          key: qt-sdk-ubuntu-22.04-${{ runner.arch }}-${{ hashFiles('scripts/qt-sdk.py') }}
      - name: Prepare pinned native Qt SDK
        run: python scripts/qt-sdk.py setup --download-attempts 3
      - name: Run workspace, CLI, tooling and native Qt checks
        run: |
          set -o pipefail
          bash scripts/check-before-push.sh 2>&1 | tee checks.log
      - name: Build packages with checksums and size gates
        run: python scripts/release/build.py --output dist/release
      - name: Verify package bytes
        run: python scripts/release/verify.py --packages dist/release
      - name: Test installed Ubuntu 22.04 packages
        run: |
          set -o pipefail
          xvfb-run -a python scripts/release/test-installed.py --packages dist/release --ci-disposable-host 2>&1 | tee lifecycle.log
      - name: Retain verified development packages
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-22.04-deb-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Export reusable native build outputs
        id: native-cache-export
        run: python3 scripts/ci/native_cache.py pack
      - name: Retain native outputs for subsequent tags
        if: steps.native-cache-export.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.native-cache-source.outputs.artifact_name }}
          path: local/native-cache-artifact/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Retain test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-22.04-diagnostics-${{ github.ref_name }}
          path: |
            checks.log
            lifecycle.log
            local/qt-test-results/
            dist/release/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain temporary artifact scope
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            echo '### Ubuntu 22.04 development packages'
            echo "Tag: $RELEASE_TAG"
            echo 'Download the ubuntu-22.04-deb artifact for the paired viewer and CLI DEBs, checksums and build metadata.'
            echo 'Only Ubuntu 22.04 was built and tested. A separate job verifies uploaded assets and automatically publishes the Ubuntu-only release.'
            echo 'Installed smoke tests cover installation, viewing/export and removal. Upgrade from an older package remains a separate test.'
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish verified Ubuntu-only release
    needs: deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: ubuntu-22.04-deb-${{ github.ref_name }}
          path: release-assets
      - name: Verify packages and render Ubuntu-only notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release/notes.py --ubuntu-only --assets release-assets \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output release-page.md
      - name: Verify uploaded bytes and publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/publish.py --assets release-assets --notes release-page.md \
            --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" \
            --title "PNM Viewer Toolkit $RELEASE_TAG — Ubuntu 22.04 development"
